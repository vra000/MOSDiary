[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mosdiary"
version = "0.1.0"
description = "Неофициальная асинхронная библиотека для работы с API школьного дневника МЭШ"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-only"
authors = [
    { name = "vra000", email = "voronin.a.romanvra@mail.ru" }
]
keywords = ["moscow", "school", "diary", "mesh", "мэш"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules"
]
dependencies = [
    "aiohttp>=3.9,<4",
    "pydantic>=2,<3",
    "segno>=1.6,<2",
    "yarl>=1.9,<2"
]

[project.urls]
Homepage = "https://github.com/vra000/MOSDiary"
Repository = "https://github.com/vra000/MOSDiary"
Issues = "https://github.com/vra000/MOSDiary/issues"

[tool.setuptools.packages.find]
include = ["mosdiary*"]